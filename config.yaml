model:
  name: gemini-2.5-flash
  temperature: 0.8
  max_output_tokens: 4096
memory:
  path: ~/.vyren/memory.json
audit:
  path: ~/.vyren/audit.log
safety:
  consequential_tools:
  - send_message
  - make_payment
  - join_meeting
  - delete_file
  - execute_command
  - shutdown_system
  - restart_system
  - install_software
  - modify_file
  - close_application
  - change_system_setting
  - edit_file
  - run_python
quiet_hours:
  start: '23:00'
  end: 07:00
  timezone: Africa/Lagos
heartbeat:
  enabled: true
  interval_seconds: 300
  quiet_hours:
    start: '23:00'
    end: 07:00
    timezone: Africa/Lagos
  checks:
  - name: cpu_monitor
    enabled: true
    threshold: 90
    interval_seconds: 60
    urgency: high
  - name: memory_monitor
    enabled: true
    threshold: 90
    interval_seconds: 60
    urgency: medium
  - name: disk_monitor
    enabled: true
    threshold: 95
    interval_seconds: 300
    urgency: low
  - name: battery_monitor
    enabled: true
    threshold: 20
    interval_seconds: 120
    urgency: high
voice:
  gemini_live_enabled: true
identity:
  assistant_name: Echo
  company: Omniel
  aliases: []
interaction:
  default_mode: silent
  always_listening: false
  wake_word_enabled: true
  continuous_conversation: false
  conversation_timeout_seconds: 180
  interrupt_during_media: false
  interrupt_during_meetings: false
  interrupt_during_gaming: false
  interrupt_during_fullscreen: false
  notification_priority: normal
  startup_speak_greeting: true
server:
  host: 0.0.0.0
  port: 8420
connectivity:
  check_interval: 10
  offline_threshold: 3
  recovery_threshold: 2
  voice_failure_threshold: 3
  voice_recovery_check_interval_s: 30
  voice_recovery_required_successes: 2
runtime:
  health_check_interval: 30
  auto_checkpoint_interval: 300
  auto_start: false
local_models:
  ollama:
    base_url: http://localhost:11434
    default_model: llama3.1
  available:
  - name: llama3.1
    provider: ollama
    capabilities:
    - chat
    - reasoning
  - name: mistral
    provider: ollama
    capabilities:
    - chat
    - reasoning
  - name: tinyllama
    provider: ollama
    capabilities:
    - chat
  - name: whisper
    provider: ollama
    capabilities:
    - stt
