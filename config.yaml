# VYREN Configuration
# Edit this file to change behavior without touching code.

model:
  name: gemini-2.5-flash
  temperature: 0.8
  max_output_tokens: 4096

memory:
  path: ~/.vyren/memory.json

audit:
  path: ~/.vyren/audit.log

safety:
  consequential_tools:
    - send_message
    - make_payment
    - join_meeting
    - delete_file
    - execute_command
    - shutdown_system
    - restart_system
    - install_software
    - modify_file
    - close_application
    - change_system_setting
    - edit_file
    - run_python

quiet_hours:
  start: "23:00"
  end: "07:00"
  timezone: "Africa/Lagos"

heartbeat:
  enabled: true
  interval_seconds: 300
  quiet_hours:
    start: "23:00"
    end: "07:00"
    timezone: "Africa/Lagos"
  checks:
    - name: cpu_monitor
      enabled: true
      threshold: 90
      interval_seconds: 60
      urgency: high
    - name: memory_monitor
      enabled: true
      threshold: 90
      interval_seconds: 60
      urgency: medium
    - name: disk_monitor
      enabled: true
      threshold: 95
      interval_seconds: 300
      urgency: low
    - name: battery_monitor
      enabled: true
      threshold: 20
      interval_seconds: 120
      urgency: high

voice:
  # Terminal voice (push-to-talk). Browser voice works without these.
  stt_provider: deepgram  # deepgram
  tts_provider: elevenlabs  # elevenlabs
  tts_voice: "21m00Tcm4TlvDq8ikWAM"  # ElevenLabs voice ID (Rachel)
  sample_rate: 16000

server:
  host: "0.0.0.0"
  port: 8420