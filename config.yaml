# VYREN Configuration
# Edit this file to change behavior without touching code.

model:
  name: gemini-2.5-flash
  temperature: 0.8
  max_output_tokens: 4096

memory:
  path: ~/.vyren/memory.json

audit:
  path: ~/.vyren/audit.log

safety:
  consequential_tools:
    - send_message
    - make_payment
    - join_meeting
    - delete_file
    - execute_command
    - shutdown_system
    - restart_system
    - install_software
    - modify_file
    - close_application
    - change_system_setting
    - edit_file
    - run_python

quiet_hours:
  start: "23:00"
  end: "07:00"
  timezone: "Africa/Lagos"

heartbeat:
  enabled: true
  interval_seconds: 300
  quiet_hours:
    start: "23:00"
    end: "07:00"
    timezone: "Africa/Lagos"
  checks:
    - name: cpu_monitor
      enabled: true
      threshold: 90
      interval_seconds: 60
      urgency: high
    - name: memory_monitor
      enabled: true
      threshold: 90
      interval_seconds: 60
      urgency: medium
    - name: disk_monitor
      enabled: true
      threshold: 95
      interval_seconds: 300
      urgency: low
    - name: battery_monitor
      enabled: true
      threshold: 20
      interval_seconds: 120
      urgency: high

# =============================================================
# VOICE CONFIGURATION
# Voice is VYREN's PRIMARY interface — like JARVIS.
# When you run `python main.py`, VYREN starts listening.
# =============================================================
voice:
  # Voice pipeline: Gemini Live native audio (voice_engine/engine.py), always on,
  # continuous mic streaming, no wake word / push-to-talk. Actual runtime
  # parameters (sample rate, model, voice name, timeouts) live in
  # voice_engine/protocol.py:VoiceEngineConfig, not here.
  #
  # No GEMINI_API_KEY -> local pyttsx3 TTS fallback (voice/runtime.py),
  # auto-recovers to Gemini Live once a key + internet are available.
  gemini_live_enabled: true

  # Offline conversation loop (voice/offline_loop.py): local STT
  # (faster-whisper) + local reasoning (ReasoningEngine already falls back
  # to Ollama in provider.py when Gemini is unreachable) + local TTS
  # (pyttsx3). Triggered automatically when there's no API key, OR when
  # the Gemini Live engine gives up after
  # voice_engine/protocol.py:max_consecutive_reconnect_failures
  # consecutive failures. Recovery back to Gemini Live is automatic
  # (checked every 30s). No barge-in while offline — see the module
  # docstring for why. Conversation history carries across the switch via
  # VoiceRuntime.recent_turns, shared by both paths.

  # Startup greeting: VYREN now speaks first, automatically, once the
  # voice engine actually connects (not on boot alone — see
  # runtime/manager.py:_on_voice_state_for_greeting). Greeting content is
  # generated by brain/greeting_engine.py:GreetingManager — pluggable
  # providers (system context, git/reminder status, live news, offline
  # content bank). No config needed here; tunables (timeout, category
  # list, content bank) live in that module and brain/data/greeting_bank.json.

server:
  host: "0.0.0.0"
  port: 8420

connectivity:
  check_interval: 10
  offline_threshold: 3
  recovery_threshold: 2

runtime:
  health_check_interval: 30
  auto_checkpoint_interval: 300
  auto_start: false

# Local model configuration (for offline mode)
local_models:
  ollama:
    base_url: "http://localhost:11434"
    default_model: "llama3.1"
  available:
    - name: llama3.1
      provider: ollama
      capabilities: [chat, reasoning]
    - name: mistral
      provider: ollama
      capabilities: [chat, reasoning]
    - name: tinyllama
      provider: ollama
      capabilities: [chat]
    - name: whisper
      provider: ollama
      capabilities: [stt]