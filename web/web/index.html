<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VYREN">
<meta name="theme-color" content="#08080f">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2308080f' width='180' height='180' rx='40'/><text x='90' y='125' text-anchor='middle' font-size='110'>⚡</text></svg>">
<title>VYREN</title>
<style>
/* ── RESET & VARIABLES ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080f;--bg2:#10101a;--bg3:#14142a;--bg-input:#0d0d18;
  --border:#1a1a2e;--border2:#2a2a4e;
  --cyan:#00d4ff;--cyan-d:rgba(0,212,255,.15);
  --green:#00ff88;--green-d:rgba(0,255,136,.12);
  --amber:#ffaa00;--amber-d:rgba(255,170,0,.12);
  --red:#ff4466;--red-d:rgba(255,68,102,.12);
  --txt:#c8c8d4;--txt-h:#fff;--txt-m:#6a6a80;
  --r:12px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --orb-size:180px;--header-h:48px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── HEADER ── */
header{display:flex;align-items:center;height:var(--header-h);padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;z-index:10;padding-top:var(--safe-top)}
.brand{font-size:15px;font-weight:700;color:var(--txt-h);letter-spacing:3px;user-select:none}
.state-badge{display:flex;align-items:center;gap:6px;margin:0 auto;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:4px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);transition:all .3s ease}
.state-dot{width:6px;height:6px;border-radius:50%;transition:background .3s,box-shadow .3s}
.header-btns{display:flex;gap:6px}
.hdr-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--txt-m);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.hdr-btn:hover{border-color:var(--border2);color:var(--txt-h);background:var(--bg3)}
.hdr-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── MAIN 3-PANEL LAYOUT ── */
main{display:grid;grid-template-columns:220px 1fr 320px;flex:1;overflow:hidden}

/* ── LEFT PANEL: SYSTEM MONITOR ── */
.panel-left{background:var(--bg2);border-right:1px solid var(--border);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mon-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt-m)}
.mon-row{display:flex;flex-direction:column;gap:5px}
.mon-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--txt-m)}
.mon-val{font-weight:600;color:var(--txt-h);font-variant-numeric:tabular-nums;font-size:12px}
.mon-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.mon-fill{height:100%;border-radius:2px;transition:width .8s ease,background .5s}
.mon-divider{height:1px;background:var(--border);margin:4px 0}
.mon-uptime{font-size:11px;color:var(--txt-m);font-variant-numeric:tabular-nums}
.mon-uptime span{color:var(--txt-h);font-weight:500}

/* ── CENTER PANEL: ORB ── */
.panel-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative;overflow:hidden}
.orb-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.orb{width:var(--orb-size);height:var(--orb-size);border-radius:50%;background:var(--bg2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .4s,box-shadow .4s,background .4s}
.orb-ring{position:absolute;inset:-12px;border-radius:50%;border:1px solid transparent;transition:border-color .4s,opacity .4s;pointer-events:none}
.orb-ring-2{position:absolute;inset:-24px;border-radius:50%;border:1px dashed transparent;transition:border-color .4s,opacity .4s,transform .4s;pointer-events:none}
.orb-inner{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:color .3s}

/* State-specific orb styles */
.orb[data-state="INITIALIZING"]{border-color:var(--border2);animation:orb-idle 4s ease-in-out infinite}
.orb[data-state="INITIALIZING"] .orb-inner{color:var(--txt-m)}
.orb[data-state="INITIALIZING"] .orb-ring-2{border-color:var(--border2);animation:spin-slow 8s linear infinite;opacity:.4}

.orb[data-state="LISTENING"]{border-color:var(--cyan);box-shadow:0 0 40px rgba(0,212,255,.15),0 0 80px rgba(0,212,255,.05);animation:orb-listen 3s ease-in-out infinite}
.orb[data-state="LISTENING"] .orb-inner{color:var(--cyan)}
.orb[data-state="LISTENING"] .orb-ring{border-color:rgba(0,212,255,.3)}

.orb[data-state="SPEAKING"]{border-color:var(--amber);box-shadow:0 0 50px rgba(255,170,0,.2),0 0 100px rgba(255,170,0,.08);animation:orb-speak 1.5s ease-in-out infinite}
.orb[data-state="SPEAKING"] .orb-inner{color:var(--amber)}
.orb[data-state="SPEAKING"] .orb-ring{border-color:rgba(255,170,0,.3)}

.orb[data-state="THINKING"]{border-color:var(--amber);box-shadow:0 0 30px rgba(255,170,0,.1);animation:orb-think 2s ease-in-out infinite}
.orb[data-state="THINKING"] .orb-inner{color:var(--amber)}
.orb[data-state="THINKING"] .orb-ring-2{border-color:rgba(255,170,0,.25);animation:spin-slow 3s linear infinite;opacity:.6}

.orb[data-state="MUTED"]{border-color:var(--red);opacity:.6}
.orb[data-state="MUTED"] .orb-inner{color:var(--red)}

.orb[data-state="IDLE"]{border-color:var(--border);box-shadow:none}
.orb[data-state="IDLE"] .orb-inner{color:var(--txt-m)}

.orb[data-state="DISCONNECTED"]{border-color:var(--red);animation:orb-disconnected 2s ease-in-out infinite;opacity:.5}
.orb[data-state="DISCONNECTED"] .orb-inner{color:var(--red)}

/* Orb keyframes */
@keyframes orb-idle{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.02);opacity:.9}}
@keyframes orb-listen{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(0,212,255,.15),0 0 80px rgba(0,212,255,.05)}50%{transform:scale(1.04);box-shadow:0 0 60px rgba(0,212,255,.25),0 0 120px rgba(0,212,255,.1)}}
@keyframes orb-speak{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes orb-think{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.03);opacity:1}}
@keyframes orb-disconnected{0%,100%{opacity:.4}50%{opacity:.6}}
@keyframes spin-slow{to{transform:rotate(360deg)}}

/* State label */
.state-label{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:color .3s}

/* ── WAVEFORM ── */
.waveform{display:flex;align-items:center;gap:2px;height:40px}
.waveform .bar{width:3px;background:var(--cyan);border-radius:2px;transition:height .1s ease,height .3s ease,background .3s,opacity .3s;opacity:.3}
.waveform.active .bar{opacity:1;animation:wave-bar var(--d,.5s) ease-in-out infinite alternate}
.waveform.active.speaking .bar{background:var(--amber)}
.waveform.active.thinking .bar{background:var(--amber);opacity:.5;animation:none;height:3px!important}

@keyframes wave-bar{from{height:var(--h-min,4px)}to{height:var(--h-max,20px)}}

/* ── RIGHT PANEL: ACTIVITY LOG ── */
.panel-right{display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--border);overflow:hidden}
.log-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt-m);padding:14px 16px 10px;flex-shrink:0}
#activity-log{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}

/* Log messages */
.log-msg{font-size:13px;line-height:1.55;max-width:100%;word-wrap:break-word;animation:log-in .25s ease}
@keyframes log-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.log-msg.user{padding:6px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--txt-h)}
.log-msg.user .log-prefix{color:var(--txt-m);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}
.log-msg.vyren{padding:6px 10px;border-radius:8px;color:var(--txt);border-left:2px solid var(--cyan)}
.log-msg.vyren .log-prefix{color:var(--cyan);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}
.log-msg.system{font-size:11px;color:var(--txt-m);text-align:center;padding:4px 8px}
.log-msg.tool{font-size:11px;color:var(--amber);text-align:center;padding:4px 10px;background:var(--amber-d);border-radius:16px;align-self:center}
.log-msg.confirm{padding:10px 14px;background:var(--red-d);border:1px solid rgba(255,68,102,.2);border-radius:var(--r);text-align:center}
.confirm-actions{display:flex;gap:8px;margin-top:8px;justify-content:center}
.confirm-actions button{padding:6px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-approve{background:var(--green);color:#000}
.btn-decline{background:var(--bg);color:var(--txt);border:1px solid var(--border2)!important}

/* Typing indicator */
.typing-dots{display:inline-flex;gap:4px;padding:6px 10px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:dot-bounce .6s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot-bounce{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-4px);opacity:1}}

/* ── FILE DROP ZONE ── */
.drop-zone-wrap{padding:0 12px;flex-shrink:0}
.drop-zone{border:1px dashed var(--border);border-radius:var(--r);padding:14px;text-align:center;font-size:12px;color:var(--txt-m);cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-d)}
.drop-zone .dz-icon{font-size:18px;margin-bottom:4px;display:block;opacity:.5}
.drop-zone .dz-file{color:var(--green);font-weight:500;margin-top:4px}
.drop-zone input{display:none}

/* ── TEXT INPUT ── */
.input-bar{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,var(--safe-bot));border-top:1px solid var(--border);flex-shrink:0;align-items:center}
#msg-input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--txt-h);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
#msg-input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-d)}
#msg-input::placeholder{color:var(--txt-m)}
.send-btn{width:36px;height:36px;border-radius:10px;background:var(--cyan);border:none;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,opacity .15s}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.25;pointer-events:none}
.send-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── RECONNECTING OVERLAY ── */
.reconnecting{position:fixed;top:0;left:0;right:0;height:2px;z-index:100;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:reconnect-slide 1.5s ease-in-out infinite}
@keyframes reconnect-slide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ── MOBILE LAYOUT (< 768px) ── */
@media(max-width:767px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .panel-left{display:none}
  .panel-center{padding:16px 16px 8px;min-height:0;gap:16px}
  .orb{--orb-size:120px}
  .orb-ring{inset:-8px}
  .orb-ring-2{inset:-16px}
  .state-label{font-size:12px}
  .waveform .bar{width:2px}
  .panel-right{border-left:none;border-top:1px solid var(--border)}
  .drop-zone-wrap{padding:8px 12px}
}

/* ── UTILITY ── */
code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:12px;font-family:'SF Mono',Monaco,'Cascadia Code',monospace}
strong{color:var(--txt-h)}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="brand">VYREN</div>
    <div class="state-badge" id="state-badge">
      <span class="state-dot" id="state-dot"></span>
      <span id="state-text">connecting</span>
    </div>
    <div class="header-btns">
      <button class="hdr-btn" id="mute-btn" title="Toggle mute (M)">
        <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="hdr-btn" id="fs-btn" title="Fullscreen (F11)">
        <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN 3-PANEL -->
  <main>

    <!-- LEFT: SYSTEM MONITOR -->
    <aside class="panel-left">
      <div class="mon-title">System</div>

      <div class="mon-row">
        <div class="mon-label"><span>CPU</span><span class="mon-val" id="cpu-val">—</span></div>
        <div class="mon-bar"><div class="mon-fill" id="cpu-fill" style="width:0%;background:var(--green)"></div></div>
      </div>
      <div class="mon-row">
        <div class="mon-label"><span>Memory</span><span class="mon-val" id="mem-val">—</span></div>
        <div class="mon-bar"><div class="mon-fill" id="mem-fill" style="width:0%;background:var(--green)"></div></div>
      </div>
      <div class="mon-row">
        <div class="mon-label"><span>Disk</span><span class="mon-val" id="disk-val">—</span></div>
        <div class="mon-bar"><div class="mon-fill" id="disk-fill" style="width:0%;background:var(--green)"></div></div>
      </div>
      <div class="mon-row">
        <div class="mon-label"><span>Network</span><span class="mon-val" id="net-val">—</span></div>
        <div class="mon-bar"><div class="mon-fill" id="net-fill" style="width:0%;background:var(--cyan)"></div></div>
      </div>

      <div class="mon-divider"></div>

      <div class="mon-row">
        <div class="mon-label"><span>Tools</span><span class="mon-val" id="tools-val">—</span></div>
      </div>
      <div class="mon-row">
        <div class="mon-label"><span>Memory</span><span class="mon-val" id="mem-entries-val">—</span></div>
      </div>

      <div class="mon-divider"></div>

      <div class="mon-uptime">Uptime: <span id="uptime-val">—</span></div>
    </aside>

    <!-- CENTER: ORB -->
    <section class="panel-center">
      <div class="orb-wrap">
        <div class="orb" id="orb" data-state="INITIALIZING">
          <div class="orb-ring"></div>
          <div class="orb-ring-2"></div>
          <div class="orb-inner" id="orb-label">...</div>
        </div>
      </div>
      <div class="state-label" id="state-label">Initializing</div>
      <div class="waveform" id="waveform"></div>
    </section>

    <!-- RIGHT: ACTIVITY LOG -->
    <aside class="panel-right">
      <div class="log-header">Activity</div>
      <div id="activity-log">
        <div class="log-msg system">VYREN ready. Type a message or use voice.</div>
      </div>

      <!-- FILE DROP ZONE -->
      <div class="drop-zone-wrap">
        <div class="drop-zone" id="drop-zone">
          <span class="dz-icon">+</span>
          Drop a file here or click to upload
          <input type="file" id="file-input">
        </div>
      </div>

      <!-- TEXT INPUT -->
      <div class="input-bar">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" id="send-btn" disabled title="Send (Enter)">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </aside>

  </main>
</div>

<!-- Reconnecting indicator bar -->
<div class="reconnecting" id="reconnecting-bar" style="display:none"></div>

<script>
// ── STATE ──
let ws = null;
let wsReconnectTimer = null;
let currentState = 'INITIALIZING';
let isMuted = false;
let isSending = false;
let lastVyrenEl = null;
let vyrenTextBuffer = '';
let metricsInterval = null;

// ── ELEMENTS ──
const $ = id => document.getElementById(id);
const orb = $('orb');
const orbLabel = $('orb-label');
const stateLabel = $('state-label');
const stateBadge = $('state-badge');
const stateDot = $('state-dot');
const stateTextEl = $('state-text');
const waveformEl = $('waveform');
const activityLog = $('activity-log');
const msgInput = $('msg-input');
const sendBtn = $('send-btn');
const muteBtn = $('mute-btn');
const fsBtn = $('fs-btn');
const dropZone = $('drop-zone');
const fileInput = $('file-input');
const reconnectBar = $('reconnecting-bar');

// ── WAVEFORM BARS (36 bars) ──
(function buildWaveform() {
  const count = 36;
  for (let i = 0; i < count; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    // Vary animation timing for organic feel
    const t = 0.3 + Math.random() * 0.6;
    const hMin = 3 + Math.random() * 4;
    const hMax = 12 + Math.random() * 22;
    bar.style.cssText = `--d:${t}s;--h-min:${hMin}px;--h-max:${hMax}px;height:${hMin}px`;
    waveformEl.appendChild(bar);
  }
})();

// ── STATE MANAGEMENT ──
const stateConfig = {
  INITIALIZING: { color: 'var(--txt-m)', dotColor: 'var(--txt-m)', label: 'Initializing', orbText: '...', badge: 'initializing', waveform: false },
  LISTENING:    { color: 'var(--cyan)', dotColor: 'var(--cyan)', label: 'Listening', orbText: '◉', badge: 'listening', waveform: true },
  SPEAKING:     { color: 'var(--amber)', dotColor: 'var(--amber)', label: 'Speaking', orbText: '◉', badge: 'speaking', waveform: true, waveformClass: 'speaking' },
  THINKING:     { color: 'var(--amber)', dotColor: 'var(--amber)', label: 'Thinking...', orbText: '...', badge: 'thinking', waveform: true, waveformClass: 'thinking' },
  MUTED:        { color: 'var(--red)', dotColor: 'var(--red)', label: 'Muted', orbText: 'MUTED', badge: 'muted', waveform: false },
  IDLE:         { color: 'var(--txt-m)', dotColor: 'var(--txt-m)', label: 'Idle', orbText: '◉', badge: 'idle', waveform: false },
  DISCONNECTED: { color: 'var(--red)', dotColor: 'var(--red)', label: 'Disconnected', orbText: '!', badge: 'disconnected', waveform: false }
};

function setState(state) {
  const cfg = stateConfig[state] || stateConfig.IDLE;
  const prev = currentState;
  currentState = state;

  // Orb
  orb.dataset.state = state;
  orbLabel.textContent = cfg.orbText;

  // State label under orb
  stateLabel.textContent = cfg.label;
  stateLabel.style.color = cfg.color;

  // Header badge
  stateDot.style.background = cfg.dotColor;
  stateDot.style.boxShadow = cfg.waveform ? `0 0 6px ${cfg.dotColor}` : 'none';
  stateTextEl.textContent = cfg.badge;
  stateBadge.style.borderColor = cfg.color;

  // Waveform
  waveformEl.className = 'waveform';
  if (cfg.waveform) {
    waveformEl.classList.add('active');
    if (cfg.waveformClass) waveformEl.classList.add(cfg.waveformClass);
  }
}

// ── WEBSOCKET ──
function connect() {
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/chat`;
  try { ws = new WebSocket(url); } catch(e) { scheduleReconnect(); return; }

  ws.onopen = () => {
    reconnectBar.style.display = 'none';
    setState('IDLE');
    addLogMsg('system', 'Connected to VYREN.');
    startMetricsPoll();
  };

  ws.onclose = () => {
    reconnectBar.style.display = '';
    setState('DISCONNECTED');
    scheduleReconnect();
    stopMetricsPoll();
  };

  ws.onerror = () => {};

  ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); }
    catch(err) { console.warn('WS parse error', err); }
  };
}

function scheduleReconnect() {
  if (wsReconnectTimer) return;
  wsReconnectTimer = setTimeout(connect, 3000);
}

// ── MESSAGE HANDLING ──
function handleMessage(data) {
  switch(data.type) {
    case 'state':
      // Server pushes a state change (e.g. LISTENING, SPEAKING, THINKING)
      if (data.state && stateConfig[data.state.toUpperCase()]) {
        setState(data.state.toUpperCase());
      }
      break;

    case 'chunk':
      setState('SPEAKING');
      appendToLastVyren(data.text);
      break;

    case 'tool_call':
      addLogMsg('tool', `Tool: ${data.name}`);
      break;

    case 'tool_result':
      addLogMsg('system', `${data.name}: ${data.result}`);
      break;

    case 'tool_declined':
      addLogMsg('system', `${data.name} declined.`);
      break;

    case 'confirmation_required':
      showConfirmation(data.name, data.args);
      break;

    case 'done':
      isSending = false;
      sendBtn.disabled = !msgInput.value.trim();
      removeTypingIndicator();
      // Stay in IDLE unless server pushes another state
      if (currentState === 'SPEAKING' || currentState === 'THINKING') setState('IDLE');
      lastVyrenEl = null;
      vyrenTextBuffer = '';
      break;

    case 'error':
      addLogMsg('system', 'Error: ' + data.message);
      isSending = false;
      sendBtn.disabled = !msgInput.value.trim();
      removeTypingIndicator();
      if (currentState === 'SPEAKING' || currentState === 'THINKING') setState('IDLE');
      lastVyrenEl = null;
      vyrenTextBuffer = '';
      break;

    case 'system_msg':
      addLogMsg('system', data.system_msg);
      break;

    case 'log':
      // Generic log entry from server
      addLogMsg('system', data.text);
      break;

    case 'metrics':
      // Server pushes system metrics
      if (data.cpu != null) updateBar('cpu', data.cpu);
      if (data.mem != null) updateBar('mem', data.mem);
      if (data.disk != null) updateBar('disk', data.disk);
      if (data.net != null) updateBar('net', data.net, true);
      break;
  }
}

// ── ACTIVITY LOG ──
function addLogMsg(type, text) {
  removeTypingIndicator();
  const div = document.createElement('div');
  div.className = 'log-msg ' + type;

  if (type === 'user') {
    div.innerHTML = `<span class="log-prefix">You</span>${esc(text)}`;
  } else if (type === 'vyren') {
    div.innerHTML = `<span class="log-prefix">VYREN</span>${formatVyrenText(text)}`;
  } else if (type === 'tool') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }

  activityLog.appendChild(div);
  scrollLog();
}

function appendToLastVyren(text) {
  vyrenTextBuffer += text;
  if (!lastVyrenEl) {
    removeTypingIndicator();
    lastVyrenEl = document.createElement('div');
    lastVyrenEl.className = 'log-msg vyren';
    activityLog.appendChild(lastVyrenEl);
  }
  lastVyrenEl.innerHTML = `<span class="log-prefix">VYREN</span>${formatVyrenText(vyrenTextBuffer)}`;
  scrollLog();
}

function showTypingIndicator() {
  if (document.querySelector('.typing-dots-wrap')) return;
  const div = document.createElement('div');
  div.className = 'typing-dots-wrap';
  div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  activityLog.appendChild(div);
  scrollLog();
}

function removeTypingIndicator() {
  const el = document.querySelector('.typing-dots-wrap');
  if (el) el.remove();
}

function showConfirmation(name, args) {
  const argStr = Object.entries(args || {}).map(([k,v]) => `${k}: ${v}`).join('\n');
  const div = document.createElement('div');
  div.className = 'log-msg confirm';
  div.innerHTML = `
    <div style="font-weight:600;margin-bottom:4px;font-size:13px">VYREN wants to:</div>
    <div style="font-family:monospace;font-size:11px;color:var(--amber);margin-bottom:4px">${esc(name)}</div>
    <div style="font-size:11px;white-space:pre-wrap;margin-bottom:8px">${esc(argStr)}</div>
    <div class="confirm-actions">
      <button class="btn-approve" data-approve="true">Allow</button>
      <button class="btn-decline" data-approve="false">Decline</button>
    </div>
  `;
  activityLog.appendChild(div);
  scrollLog();

  div.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const approved = btn.dataset.approve === 'true';
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'confirmation', approved }));
      div.remove();
      addLogMsg('system', approved ? `${name} approved.` : `${name} declined.`);
    });
  });
}

function scrollLog() {
  requestAnimationFrame(() => { activityLog.scrollTop = activityLog.scrollHeight; });
}

function formatVyrenText(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ── SEND MESSAGE ──
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isSending) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addLogMsg('system', 'Not connected. Reconnecting...');
    connect();
    return;
  }
  isSending = true;
  sendBtn.disabled = true;
  setState('THINKING');
  addLogMsg('user', text);
  msgInput.value = '';
  showTypingIndicator();
  ws.send(JSON.stringify({ type: 'message', text }));
}

msgInput.addEventListener('input', () => {
  sendBtn.disabled = !msgInput.value.trim() || isSending;
});
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

// ── SYSTEM MONITOR (REST + WS metrics) ──
function updateBar(id, value, isNet) {
  const valEl = $(id + '-val');
  const fillEl = $(id + '-fill');
  if (!valEl || !fillEl) return;

  let displayVal, width, color;
  if (isNet) {
    displayVal = value.toFixed(1) + ' MB/s';
    width = Math.min(value / 50 * 100, 100);
    color = 'var(--cyan)';
  } else {
    displayVal = Math.round(value) + '%';
    width = Math.min(value, 100);
    color = value > 90 ? 'var(--red)' : value > 75 ? 'var(--amber)' : 'var(--green)';
  }
  valEl.textContent = displayVal;
  fillEl.style.width = width + '%';
  fillEl.style.background = color;
}

async function fetchStatus() {
  try {
    const r = await fetch('/api/system');
    const d = await r.json();
    if (d.cpu_percent != null) updateBar('cpu', d.cpu_percent);
    if (d.memory_percent != null) updateBar('mem', d.memory_percent);
    if (d.disk_percent != null) updateBar('disk', d.disk_percent);
    // Network via /api/heartbeat or system
    $('tools-val').textContent = (d.tool_count || 0) + ' loaded';
    $('mem-entries-val').textContent = (d.memory_entries || 0) + ' entries';
    $('uptime-val').textContent = d.uptime || '—';
  } catch(e) {}
}

function startMetricsPoll() {
  fetchStatus(); // immediate
  metricsInterval = setInterval(fetchStatus, 2000);
}

function stopMetricsPoll() {
  if (metricsInterval) { clearInterval(metricsInterval); metricsInterval = null; }
}

// ── FILE DROP ZONE ──
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  addLogMsg('system', `File selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
  // TODO: upload to server when endpoint is available
  // For now, send the filename as a message
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'message', text: `[File: ${file.name}]` }));
    addLogMsg('user', `[Uploaded: ${file.name}]`);
  }
}

// ── MUTE TOGGLE ──
function toggleMute() {
  isMuted = !isMuted;
  muteBtn.style.color = isMuted ? 'var(--red)' : '';
  muteBtn.style.borderColor = isMuted ? 'var(--red)' : '';
  muteBtn.style.background = isMuted ? 'var(--red-d)' : '';
  if (isMuted) {
    setState('MUTED');
    // Send mute command to server
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'mute', muted: true }));
  } else {
    setState('IDLE');
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'mute', muted: false }));
  }
}
muteBtn.addEventListener('click', toggleMute);

// ── FULLSCREEN ──
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}
fsBtn.addEventListener('click', toggleFullscreen);

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', (e) => {
  // Don't intercept when typing in input
  if (document.activeElement === msgInput) {
    if (e.key === 'Escape') { msgInput.blur(); return; }
    return;
  }

  if (e.key === 'F4' || (e.key === 'm' || e.key === 'M')) {
    e.preventDefault();
    toggleMute();
  }
  if (e.key === 'F11') {
    e.preventDefault();
    toggleFullscreen();
  }
  if (e.key === 'Escape') {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  }
});

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ── INIT ──
setState('INITIALIZING');
connect();
</script>
